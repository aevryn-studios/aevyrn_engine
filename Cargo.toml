[workspace]
members = [
    "crates/aevyrn_core",
    "crates/aevyrn_window",
    "crates/aevyrn_renderer",
    "crates/aevyrn_runtime",
    "crates/aevyrn_cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aevyrn Studios"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aevryn-studios/aevyrn_engine"
keywords = ["game-engine", "graphics", "3d", "ai"]
categories = ["game-engines", "rendering", "gui"]

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
winit = "0.30"
wgpu = "0.20"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
